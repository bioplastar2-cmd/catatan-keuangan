<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Catatan Keuangan</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Catatan Keuangan, beranda">
        <span class="brand-icon" aria-hidden="true">Rp</span>
        <span>Catatan<span class="brand-light">Keuangan</span></span>
      </a>
    </header>

    <section class="intro">
      <h1>Catatan keuangan</h1>
    </section>

    <p id="message" class="message" role="status" aria-live="polite" hidden></p>

    <section class="report-toolbar" aria-labelledby="monthly-report-heading">
      <div>
        <h2 id="monthly-report-heading">Ringkasan bulanan</h2>
        <p id="selected-month-label" hidden></p>
      </div>
      <div class="month-picker">
        <label for="month">Bulan</label>
        <input id="month" name="month" type="month">
      </div>
    </section>

    <section id="monthly-summary" class="summary" aria-label="Ringkasan bulanan">
      <article class="summary-card balance-card">
        <span class="summary-label">Sisa bersih</span>
        <strong id="balance">Rp 0</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">Pemasukan</span>
        <strong id="income" class="income-text">Rp 0</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">Pengeluaran</span>
        <strong id="expense" class="expense-text">Rp 0</strong>
      </article>
    </section>

    <div class="content-grid">
      <section class="panel form-panel">
        <div class="section-heading">
          <div>
            <h2 id="form-heading">Tambah transaksi</h2>
          </div>
          <span class="heading-mark" aria-hidden="true">+</span>
        </div>
        <form id="transaction-form">
          <label for="transaction_date">Tanggal</label>
          <input id="transaction_date" name="transaction_date" type="date" required>

          <label for="transaction_type">Tipe transaksi</label>
          <select id="transaction_type" name="transaction_type" required>
            <option value="pengeluaran">Pengeluaran</option>
            <option value="pemasukan">Pemasukan</option>
          </select>

          <label for="amount">Nominal</label>
          <div class="amount-input">
            <span>Rp</span>
            <input id="amount" name="amount" type="number" min="1" step="1"
                   inputmode="numeric" placeholder="Contoh: 50000" required>
          </div>
          <label for="description">Keterangan</label>
          <input id="description" name="description" type="text" maxlength="120"
                 placeholder="Contoh: Gaji, beli beras, rokok" required>

          <div class="form-actions">
            <button id="submit-transaction" class="save-button" type="submit">Simpan transaksi <span aria-hidden="true">→</span></button>
            <button id="cancel-edit" class="secondary-button cancel-edit-button" type="button" hidden>Batal edit</button>
          </div>
        </form>
      </section>

      <section class="panel report-panel">
        <div class="section-heading">
          <div>
            <h2>Riwayat transaksi</h2>
          </div>
        </div>

        <div id="transaction-list" class="transaction-list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span aria-hidden="true">◷</span>
          <strong>Belum ada transaksi</strong>
        </div>
        <p id="report-footnote" hidden></p>
      </section>
    </div>
    <section class="panel backup-panel" aria-labelledby="backup-heading">
      <div>
        <h2 id="backup-heading">Cadangan data</h2>
        <p class="backup-copy">Unduh file untuk pindah HP.</p>
      </div>
      <div class="backup-actions">
        <button id="export-backup" class="secondary-button" type="button">Unduh cadangan</button>
        <button id="choose-backup" class="save-button restore-button" type="button">Pulihkan cadangan</button>
        <input id="backup-file" type="file" accept=".json,application/json" hidden>
      </div>
    </section>
  </main>
</body>
</html>
